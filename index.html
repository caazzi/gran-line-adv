<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gran Line Adventure — A Thousand Sunny Voyage</title>
  <meta name="description"
    content="Gran Line Adventure: an unofficial, non-commercial One Piece fan game. Sail the Thousand Sunny, collect Devil Fruits and battle bosses in this keyboard-only browser game.">
  <meta name="theme-color" content="#0a0a2e">
  <meta name="color-scheme" content="dark">

  <link rel="icon" type="image/png" href="/favicon.png">

  <!-- Open Graph / social preview -->
  <meta property="og:title" content="Gran Line Adventure">
  <meta property="og:description"
    content="A Thousand Sunny Voyage — an unofficial One Piece fan game. Keyboard only, playable in the browser.">
  <!-- Replace with the absolute deployed URL (e.g. https://your-site.netlify.app/og.png) after the first deploy. -->
  <meta property="og:image" content="/og.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Gran Line Adventure">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Gran Line Adventure">
  <meta name="twitter:description"
    content="A Thousand Sunny Voyage — an unofficial One Piece fan game. Keyboard only, playable in the browser.">
  <meta name="twitter:image" content="/og.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Reserve room for the fixed footer so it never covers the canvas.
         max-height wins over the inline height Kaplay applies to <body>. */
      height: calc(100vh - 28px);
      height: calc(100dvh - 28px);
      max-height: calc(100vh - 28px);
      max-height: calc(100dvh - 28px);
      overflow: hidden;
    }

    canvas {
      border-radius: 8px;
    }

    /* Fixed page footer: never intercepts clicks except on its links. */
    #game-meta {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 4px 12px;
      padding: 4px 10px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      line-height: 1.4;
      color: rgba(200, 215, 240, 0.55);
      text-align: center;
      pointer-events: none;
      background: rgba(10, 10, 46, 0.35);
    }

    #game-meta a {
      color: rgba(180, 210, 255, 0.85);
      text-decoration: underline;
      text-underline-offset: 2px;
      pointer-events: auto;
    }

    #game-meta a:hover,
    #game-meta a:focus-visible {
      color: #ffffff;
    }

    #game-meta .meta-version {
      color: rgba(255, 215, 0, 0.65);
      font-variant-numeric: tabular-nums;
    }

    #game-meta .meta-disclaimer {
      opacity: 0.85;
    }

    @media (max-width: 640px) {
      #game-meta {
        gap: 3px 10px;
        font-size: 10px;
        padding: 2px 8px;
      }

      #game-meta .meta-disclaimer {
        display: none;
      }
    }
  </style>
</head>

<body>
  <script type="module" src="/src/main.js"></script>

  <footer id="game-meta" aria-label="Informações do jogo">
    <span class="meta-version">v0.1.0</span>
    <a href="https://github.com/caazzi/gran-line-adv/issues/new?title=Playtest%20feedback" target="_blank"
      rel="noopener noreferrer">Feedback</a>
    <span class="meta-disclaimer">Unofficial fan project. Not affiliated with Eiichiro Oda/Toei. Non-commercial.</span>
  </footer>
</body>

</html>
